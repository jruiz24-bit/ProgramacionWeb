<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <h1>Formulario de Registro</h1>
    
    
    <form action="#" method="GET">
        
        
        <label for="id_usuario">ID de Usuario:</label>
        <input type="text" id="id_usuario" name="id_usuario" value="USR-999" disabled>
        <br><br>

        
        <label for="nombre_usuario">Nombre de usuario (5 a 15 letras):</label>
        <input type="text" id="nombre_usuario" name="nombre_usuario" required minlength="5" maxlength="15">
        <br><br>

       
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@uabcs.mx" required>
        <br><br>

        
        <label for="telefono">Telefono (Solo numeros):</label>
        <input type="text" id="telefono" name="telefono" pattern="[0-9]+" required>
        <br><br>

        <button type="submit">Guardar</button>
    </form>

    <br><br><br>
    <div id="enlaces">
        <a href="index.html">Ir al home</a>
        <br>
        <a href="#footer">Ir al footer</a>
        <br>
        <a href="about.html">Ir al about</a>
        <br>
        <a href="contac.html">Ir al contacto</a>
        <br>    
    </div>
</body>
</html>
